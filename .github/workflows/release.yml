name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.2.0)'
        required: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Whether a signing certificate is configured. Referenced in the step below,
      # since the secrets context is not usable directly in a step-level `if`.
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      # Updater.swift compares dotted numeric versions, so the tag's leading "v" has
      # to come off before it reaches CFBundleShortVersionString.
      - name: Work out the version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version '$VERSION' is not X.Y.Z"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      # A runner starts with an empty keychain, so the certificate has to be imported
      # before build.sh can find it. build.sh looks for an identity called "Deadeye
      # Local Signing" and falls back to ad-hoc if it is absent, so a failure here
      # degrades to exactly what shipped before rather than breaking the release.
      # A runner starts with an empty keychain, so the certificate has to be imported
      # before build.sh can find it. Everything here is best effort: build.sh falls
      # back to ad-hoc when no usable identity exists, so a broken secret degrades to
      # what shipped before rather than failing the release.
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -uo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/cert.p12"

          printf '%s' "$CERT_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"

          # Without this, codesign prompts for keychain access and hangs on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null 2>&1

          # On the search list, or find-identity and codesign cannot see it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "Identities in the imported keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/^/  /'

          # Do not assume a name. Whichever certificate is in the secret is the one to
          # sign with, and an earlier version of this step hardcoded "Deadeye Local
          # Signing" and failed the whole release when the export contained a
          # differently named identity.
          CN=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                 | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          if [ -z "$CN" ]; then
            echo "::warning::no code signing identity in the secret; the build will be ad-hoc"
            exit 0
          fi
          echo "Signing identity: $CN"

          # A self-signed certificate has to be trusted for code signing or codesign
          # refuses to use it.
          if security find-certificate -c "$CN" -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem" 2>/dev/null; then
            security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem" \
              || echo "::warning::could not mark $CN as trusted for code signing"
            rm -f "$RUNNER_TEMP/cert.pem"
          fi

          echo "SIGN_IDENTITY=$CN" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh --version '${{ steps.v.outputs.version }}'

      - name: Verify the version actually landed in the bundle
        run: |
          GOT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Deadeye.app/Contents/Info.plist)
          echo "bundle reports: $GOT"
          [ "$GOT" = '${{ steps.v.outputs.version }}' ] || {
            echo "::error::bundle says $GOT, expected ${{ steps.v.outputs.version }}"; exit 1; }

      - name: Test
        run: ./run-tests.sh

      # ditto, not zip: it preserves the bundle's symlinks and resource forks, which a
      # plain zip mangles.
      - name: Report how the app was signed
        run: |
          codesign -dvv Deadeye.app 2>&1 | grep -E "Authority|Signature|flags" || true
          if command -v syspolicy_check >/dev/null; then
            syspolicy_check distribution Deadeye.app 2>&1 | grep -E "Adhoc|Notary|Severity" || true
          fi

      - name: Package
        run: |
          ditto -c -k --keepParent Deadeye.app "Deadeye-${{ steps.v.outputs.version }}.zip"
          shasum -a 256 "Deadeye-${{ steps.v.outputs.version }}.zip" \
            > "Deadeye-${{ steps.v.outputs.version }}.zip.sha256"
          cat "Deadeye-${{ steps.v.outputs.version }}.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          # This build is ad-hoc signed, not notarised, so Gatekeeper will quarantine
          # it after download. The install note below is not optional decoration —
          # without it the app reports itself as damaged on Apple Silicon.
          cat > notes.md <<'NOTES'
          ## Install

          1. Unzip and drag **Deadeye** to `/Applications`.
          2. This build is not notarised, so macOS quarantines it on download. Clear
             that once:

              ```sh
              xattr -dr com.apple.quarantine /Applications/Deadeye.app
              ```

             If you skip this, macOS says **"Deadeye is damaged and can't be
             opened"**. It is not damaged. There is no Open Anyway button for this
             build, because that only appears for apps signed with a paid developer
             certificate. The command is the only route.

          3. Open it and grant **Accessibility** when asked. Deadeye needs it to see a
             click before the menu bar does.

          An eye appears in your menu bar. It blinks when a game starts and again when
          you finish.

          ## Checksum
          NOTES
          echo '```' >> notes.md
          cat "Deadeye-$V.zip.sha256" >> notes.md
          echo '```' >> notes.md

          gh release create "v$V" \
            "Deadeye-$V.zip" "Deadeye-$V.zip.sha256" \
            --title "Deadeye v$V" \
            --notes-file notes.md \
            --verify-tag || \
          gh release create "v$V" \
            "Deadeye-$V.zip" "Deadeye-$V.zip.sha256" \
            --title "Deadeye v$V" \
            --notes-file notes.md

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
