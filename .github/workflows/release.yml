name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.2.0)'
        required: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # Whether a signing certificate is configured. Referenced in the step below,
      # since the secrets context is not usable directly in a step-level `if`.
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      # Updater.swift compares dotted numeric versions, so the tag's leading "v" has
      # to come off before it reaches CFBundleShortVersionString.
      - name: Work out the version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version '$VERSION' is not X.Y.Z"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      # A runner starts with an empty keychain, so the certificate has to be imported
      # before build.sh can find it. build.sh looks for an identity called "Deadeye
      # Local Signing" and falls back to ad-hoc if it is absent, so a failure here
      # degrades to exactly what shipped before rather than breaking the release.
      # A runner starts with an empty keychain, so the certificate has to be imported
      # before build.sh can find it. Everything here is best effort: build.sh falls
      # back to ad-hoc when no usable identity exists, so a broken secret degrades to
      # what shipped before rather than failing the release.
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -uo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/cert.p12"

          printf '%s' "$CERT_P12" | base64 --decode > "$P12"
          # Size only, never contents. A truncated or mis-encoded secret shows up here
          # as a tiny or zero-byte file, which is otherwise invisible.
          echo "decoded p12: $(stat -f%z "$P12" 2>/dev/null || echo 0) bytes"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Captured rather than left to vanish. The first attempt at this failed with
          # no output at all, which told us nothing about why.
          IMPORT_OUT=$(security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security 2>&1)
          IMPORT_RC=$?
          echo "security import exit $IMPORT_RC: ${IMPORT_OUT:-(no output)}"
          rm -f "$P12"

          # Certificates and identities are counted separately on purpose. A p12
          # exported without its private key imports the certificate fine and yields
          # zero identities, and "0 valid identities" alone does not distinguish that
          # from a wrong password or a bad decode.
          echo "certificates in keychain: $(security find-certificate -a "$KEYCHAIN" 2>/dev/null | grep -c '^keychain:' || true)"

          # Without this, codesign prompts for keychain access and hangs on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null 2>&1

          # On the search list, or find-identity and codesign cannot see it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Deliberately WITHOUT -v. "-v" means "valid identities only", and a
          # self-signed certificate is not valid for code signing until it has been
          # trusted, which happens further down. Listing with -v first reported zero
          # identities for a perfectly good p12 and sent the build to ad-hoc.
          echo "All identities in the imported keychain:"
          security find-identity -p codesigning "$KEYCHAIN" | sed 's/^/  /'

          CN=$(security find-identity -p codesigning "$KEYCHAIN" \
                 | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          if [ -z "$CN" ]; then
            echo "::warning::no code signing identity in the secret; the build will be ad-hoc."
            echo "::warning::If a certificate was imported but no identity, the p12 is missing its private key. Export from Keychain Access under My Certificates, not Certificates."
            exit 0
          fi
          echo "Signing identity: $CN"

          # A self-signed certificate has to be trusted for code signing or codesign
          # refuses to use it. The user trust domain is tried first; runners have
          # passwordless sudo, so the system domain is the fallback.
          # Only the admin domain via sudo, and only with sudo -n. The user-domain form
          # (security add-trusted-cert without -d) asks for authorisation through the
          # GUI, and on a runner there is nobody to answer it: it does not fail, it
          # hangs. A release sat in that state for minutes before being cancelled.
          # sudo -n refuses rather than prompting, so this either works or returns.
          if security find-certificate -c "$CN" -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem" 2>/dev/null; then
            if sudo -n security add-trusted-cert -d -r trustRoot -p codeSign \
                 -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" 2>&1; then
              echo "trusted $CN for code signing"
            else
              echo "::warning::could not trust $CN; codesign will refuse it and the build will be ad-hoc"
            fi
            rm -f "$RUNNER_TEMP/cert.pem"
          else
            echo "::warning::could not export $CN to trust it"
          fi

          # Now that it is trusted it should pass the validity filter. If this is
          # empty, codesign will refuse the identity and build.sh will go ad-hoc.
          echo "Valid code signing identities after trusting:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/^/  /'

          echo "SIGN_IDENTITY=$CN" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh --version '${{ steps.v.outputs.version }}'

      - name: Verify the version actually landed in the bundle
        run: |
          GOT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Deadeye.app/Contents/Info.plist)
          echo "bundle reports: $GOT"
          [ "$GOT" = '${{ steps.v.outputs.version }}' ] || {
            echo "::error::bundle says $GOT, expected ${{ steps.v.outputs.version }}"; exit 1; }

      - name: Test
        run: ./run-tests.sh

      # ditto, not zip: it preserves the bundle's symlinks and resource forks, which a
      # plain zip mangles.
      - name: Report how the app was signed
        run: |
          codesign -dvv Deadeye.app 2>&1 | grep -E "Authority|Signature|flags" || true
          if command -v syspolicy_check >/dev/null; then
            syspolicy_check distribution Deadeye.app 2>&1 | grep -E "Adhoc|Notary|Severity" || true
          fi

      - name: Package
        run: |
          ditto -c -k --keepParent Deadeye.app "Deadeye-${{ steps.v.outputs.version }}.zip"
          shasum -a 256 "Deadeye-${{ steps.v.outputs.version }}.zip" \
            > "Deadeye-${{ steps.v.outputs.version }}.zip.sha256"
          cat "Deadeye-${{ steps.v.outputs.version }}.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          # This build is ad-hoc signed, not notarised, so Gatekeeper will quarantine
          # it after download. The install note below is not optional decoration —
          # without it the app reports itself as damaged on Apple Silicon.
          cat > notes.md <<'NOTES'
          ## Install

          1. Unzip and drag **Deadeye** to `/Applications`.
          2. Open it. macOS will refuse the first time, because Deadeye is signed but
             not notarised. Go to **System Settings > Privacy & Security**, scroll to
             the bottom, and click **Open Anyway**.
          3. Grant **Accessibility** when asked. Deadeye needs it to see a click
             before the menu bar does.

          <details>
          <summary>If there is no Open Anyway button</summary>

          Some Macs report the app as damaged instead. It is not damaged. Clear the
          download quarantine and open it again:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Deadeye.app
          ```
          </details>

          An eye appears in your menu bar. It blinks when a game starts and again when
          you finish.

          ## Checksum
          NOTES
          echo '```' >> notes.md
          cat "Deadeye-$V.zip.sha256" >> notes.md
          echo '```' >> notes.md

          gh release create "v$V" \
            "Deadeye-$V.zip" "Deadeye-$V.zip.sha256" \
            --title "Deadeye v$V" \
            --notes-file notes.md \
            --verify-tag || \
          gh release create "v$V" \
            "Deadeye-$V.zip" "Deadeye-$V.zip.sha256" \
            --title "Deadeye v$V" \
            --notes-file notes.md

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
